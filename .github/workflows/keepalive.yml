# Keepalive — DO NOT DELETE.
#
# This workflow has no visible effect: it looks like noise, and that is exactly why
# this comment exists. It neutralises TWO countdowns that, without it, shut the tool
# down on their own and in silence.
#
# 1. SUPABASE PAUSES a Free project that receives too few user queries over the past
#    week. It is a volume threshold, not a timer, and Supabase publishes no number: its
#    doc only says that "a few user requests to the database each day" keep a project
#    up. A tool consulted sporadically by two people falls under it in days. A paused
#    project cannot be woken by connecting to it — only resumed by hand from the
#    dashboard — so this job can prevent a pause, never repair one.
#    -> remedy: every day, real reads on user tables, through both ways in that the doc
#       names: requests from the connected application, and API calls to the project.
#
# 2. GITHUB DISABLES a scheduled workflow after 60 days without activity on the
#    REPOSITORY. The monthly sweep would therefore stop by itself after two months
#    without a commit. The trap: a workflow run DOES NOT COUNT as activity — only a
#    commit does. So the sweep cannot keep itself alive.
#    -> remedy: commit a timestamp every week.
#
# The two remedies are two jobs on two schedules, so that a paused database no longer
# stops the commits too. Deleting this file shuts the database down within days and the
# sweep within two months, and nothing will point back here.
# See .specs/technique/09-deploiement.md and D35.

name: Keepalive

on:
  schedule:
    # Every day: the database. Off the round hour, because schedules on a round hour
    # queue up on GitHub's side.
    #
    # Every day, because a burst does not carry the week. On 1 October 2026 the sweep sent
    # thousands of queries through the pooler, a keepalive ran `select 1` on the 5th, and
    # the project was paused before the 8th all the same.
    - cron: '17 5 * * *'
    # Every Monday: the commit. A daily one would bury the history under timestamps.
    - cron: '47 5 * * 1'
  workflow_dispatch:

concurrency:
  group: keepalive
  cancel-in-progress: false

permissions: {}

jobs:
  wake-database:
    # On a fork, neither the secret nor the counter belongs to this project.
    #
    # `!=` rather than `== daily`, in both jobs: if a cron string above is edited and its
    # copy here is not, the job runs too often instead of never. A manual run has no
    # schedule, so it runs both jobs — which is what checks a setup end to end.
    if: github.repository == 'Ruhm42/dish-my-taste-job' && github.event.schedule != '47 5 * * 1'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # Postgres through the pooler, the way the app and the sweep reach the database.
      # Reads on user tables rather than `select 1`: the doc counts user queries, and
      # `select 1` is what every pooler and health check sends. The psql client is
      # preinstalled on the runner, so no project dependency is needed here.
      #
      # Failing loudly is deliberate: a database that does not answer is already paused,
      # or the URL changed. That is precisely what we want to learn from an alert rather
      # than from a user. Hence ON_ERROR_STOP: without it, psql exits 0 when any query but
      # the last one fails.
      - name: Query the database
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: >-
          psql "$DATABASE_URL" --no-psqlrc --set ON_ERROR_STOP=1
          -c 'select count(*) as restaurants from restaurant'
          -c 'select count(*) as cells from cell'
          -c 'select max(started_at) as last_sweep from sweep_run'

      # API calls to the project, the other way in the doc names. The doc does not say
      # whether pooler traffic counts as a user request, and the 1 October burst suggests
      # it may not; a request through the API gateway is one in its own words.
      #
      # Both values are public by design, hence repository variables and not secrets.
      # Every table has RLS enabled with no policy, so each request runs a query and reads
      # nothing. The body is printed only on failure, where it is PostgREST's error.
      - name: Query the Data API
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          : "${SUPABASE_URL:?the repository variable is not set}"
          : "${SUPABASE_PUBLISHABLE_KEY:?the repository variable is not set}"
          for table in restaurant cell sweep_run; do
            body=$(curl --silent --show-error --fail-with-body \
              --header "apikey: $SUPABASE_PUBLISHABLE_KEY" \
              "$SUPABASE_URL/rest/v1/$table?select=id&limit=1") \
              || { echo "$body"; exit 1; }
          done

  commit-timestamp:
    if: github.repository == 'Ruhm42/dish-my-taste-job' && github.event.schedule != '17 5 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    # Required to push the timestamp: the commit, and only the commit, resets GitHub's
    # inactivity counter.
    permissions:
      contents: write

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      # The file's content serves no purpose: the COMMIT is the point of the gesture. The
      # file carries its own explanation so that the next person who stumbles on it does
      # not take it for leftover junk.
      #
      # A push authenticated by GITHUB_TOKEN retriggers no workflow: no loop is
      # possible, and no pointless Vercel redeploy every week.
      - name: Commit the timestamp
        run: |
          {
            echo "Timestamp written every week by .github/workflows/keepalive.yml."
            echo "Its only role is to produce a commit — see the header of that workflow."
            date -u +'%Y-%m-%dT%H:%M:%SZ'
          } > .github/last-activity.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/last-activity.txt
          git diff --cached --quiet && exit 0
          git commit -m 'chore: keepalive'
          git push

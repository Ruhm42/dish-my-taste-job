# Keepalive — DO NOT DELETE.
#
# This workflow has no visible effect: it looks like noise, and that is exactly why
# this comment exists. It neutralises TWO countdowns that, without it, shut the tool
# down on their own and in silence.
#
# 1. SUPABASE PAUSES a project after 7 days without activity on the database, and a
#    prolonged pause eventually ends in the project being deleted. A tool consulted
#    sporadically by two people reaches 7 days effortlessly.
#    -> remedy: open a connection to the database every week.
#
# 2. GITHUB DISABLES a scheduled workflow after 60 days without activity on the
#    REPOSITORY. The monthly sweep would therefore stop by itself after two months
#    without a commit. The trap: a workflow run DOES NOT COUNT as activity — only a
#    commit does. So the sweep cannot keep itself alive.
#    -> remedy: commit a timestamp every week.
#
# Both remedies fit in a single weekly workflow: the job below. Deleting it shuts the
# tool down, with a month's delay before anyone notices.
# See .specs/technique/09-deploiement.md.

name: Keepalive

on:
  schedule:
    # Every Monday. Off-the-hour time: schedules on a round hour queue up on GitHub's
    # side and can be delayed by tens of minutes. A weekly cadence leaves two attempts
    # before Supabase's 7 days.
    - cron: '17 5 * * 1'
  workflow_dispatch:

concurrency:
  group: keepalive
  cancel-in-progress: false

# Required to push the timestamp: the commit, and only the commit, resets GitHub's
# inactivity counter.
permissions:
  contents: write

jobs:
  keepalive:
    # On a fork, neither the secret nor the counter belongs to this project.
    if: github.repository == 'Ruhm42/dish-my-taste-job'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      # Countdown no. 1. `select 1` is enough: it is the CONNECTION that counts as
      # activity, not what it reads. The psql client is preinstalled on the runner, so
      # no project dependency is needed here.
      # Failing loudly is deliberate: a database that does not answer means it is
      # already paused, or the URL changed. That is precisely what we want to learn
      # from an alert rather than from a user.
      - name: Wake the database
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: psql "$DATABASE_URL" --no-psqlrc --quiet -c 'select 1'

      # Countdown no. 2. The file's content serves no purpose: the COMMIT is the point
      # of the gesture. The file carries its own explanation so that the next person
      # who stumbles on it does not take it for leftover junk.
      #
      # A push authenticated by GITHUB_TOKEN retriggers no workflow: no loop is
      # possible, and no pointless Vercel redeploy every week.
      - name: Commit the timestamp
        run: |
          {
            echo "Timestamp written every week by .github/workflows/keepalive.yml."
            echo "Its only role is to produce a commit — see the header of that workflow."
            date -u +'%Y-%m-%dT%H:%M:%SZ'
          } > .github/last-activity.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/last-activity.txt
          git diff --cached --quiet && exit 0
          git commit -m 'chore: keepalive'
          git push

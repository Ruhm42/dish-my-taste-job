# Monthly sweep.
#
# This is the project's ONLY costly item: 692 Nearby Search calls per run, against
# a free quota of 1,000 per month, and with no fallback credit on the billing
# account. Any overage bills a real card.
# See .specs/technique/02-budget-google-et-garde-fous.md.

name: Monthly sweep

on:
  schedule:
    # The 1st of the month, 03:00 UTC. Anchoring on the 1st guarantees that hours are
    # replaced before the 30-day expiry the Google terms of service impose (D7).
    - cron: '0 3 1 * *'
  workflow_dispatch:

# Two simultaneous sweeps would burn the month's quota in one go.
# `cancel-in-progress` is deliberately left at false: cancelling a running sweep
# would leave the database half written AND waste the calls already issued.
# A queued run will not spend anything on its own: the script refuses to replay a
# sweep that succeeded less than 25 days ago (SWEEP.daysBetweenSweeps).
concurrency:
  group: sweep
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sweep:
    # A fork must never trigger a sweep: the quota spent would be that of the
    # original Google project.
    if: github.repository == 'Ruhm42/dish-my-taste-job'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Live mode. `--dry-run` is the default of every script that spends quota:
      # lifting it is an explicit decision, and this is where that decision is taken.
      # `--go` rather than `--no-dry-run`: that is the flag `sweep.ts` already uses, and
      # a cycle that lifts the dry-run differently from the script it drives would end
      # up diverging from it.
      #
      # No `continue-on-error`, no `|| true`: if the sweep fails — an unresolved
      # truncated cell, quota exceeded, database unreachable — the job must fail. A
      # silently incomplete database is worse than a failing job, and in the meantime
      # the application keeps serving the previous month's data.
      - name: Run the sweep in live mode
        env:
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node --import tsx scripts/cron-refresh.ts --go

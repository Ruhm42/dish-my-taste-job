# Balayage mensuel.
#
# C'est le SEUL poste coûteux du projet : 692 appels Nearby Search par exécution,
# sur un quota gratuit de 1 000 par mois, et sans aucun crédit de secours sur le
# compte de facturation. Tout dépassement part sur une carte bancaire.
# Voir .specs/technique/02-budget-google-et-garde-fous.md.

name: Balayage mensuel

on:
  schedule:
    # Le 1er du mois, 03:00 UTC. Le calage au 1er garantit que le remplacement des
    # horaires précède l'expiration des 30 jours imposée par les CGU Google (D7).
    - cron: '0 3 1 * *'
  workflow_dispatch:

# Deux balayages simultanés consommeraient le quota du mois en une fois.
# `cancel-in-progress` reste à false volontairement : interrompre un balayage en
# cours laisserait la base à moitié écrite ET les appels déjà émis seraient perdus.
# Une exécution en attente ne dépensera rien de son côté : le script refuse de
# rejouer un balayage réussi depuis moins de 25 jours (BALAYAGE.joursEntreBalayages).
concurrency:
  group: balayage
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  balayage:
    # Un fork ne doit jamais déclencher de balayage : le quota consommé serait
    # celui du projet Google d'origine.
    if: github.repository == 'Ruhm42/dish-my-taste-job'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      # Mode réel. `--dry-run` est le défaut de tout script consommant du quota :
      # le lever est une décision explicite, et c'est ici qu'elle est prise.
      # `--go` et pas `--no-dry-run` : c'est le drapeau qu'utilise déjà `sweep.ts`,
      # et un cycle qui lève le dry-run autrement que le script qu'il pilote finirait
      # par diverger de lui.
      #
      # Aucun `continue-on-error`, aucun `|| true` : si le balayage échoue —
      # cellule tronquée non résolue, quota dépassé, base injoignable — le job doit
      # échouer. Une base silencieusement incomplète est pire qu'un job en erreur,
      # et l'application continue pendant ce temps de servir les données du mois
      # précédent.
      - name: Balayage en mode réel
        env:
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node --import tsx scripts/cron-refresh.ts --go
